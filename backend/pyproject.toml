[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "patrikvalentiny", email = "patrikvalentiny@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astral>=3.2",
    "eccodes>=2.50.0",
    "eccodeslib>=2.50.0.33 ; sys_platform != 'win32'",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "tzdata>=2026.6",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
